name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/resolve-desk-ai/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend/resolve-desk-ai
      - name: Test frontend
        run: npm test -- --watch=false
        working-directory: frontend/resolve-desk-ai
      - name: Build public pages and demo
        run: npm run build:backend
        working-directory: frontend/resolve-desk-ai
      - name: Test backend and HTTP indexing rules
        run: dotnet test ResolveDeskAI.sln --configuration Release
      - name: Prepare IIS deployment package
        run: dotnet publish backend/ResolveDeskAI.Api/ResolveDeskAI.Api.csproj --configuration Release --output artifacts/site -p:SkipFrontendBuild=true
      - uses: actions/upload-artifact@v4
        with:
          name: resolvedeskai-site
          path: artifacts/site/
          retention-days: 14
